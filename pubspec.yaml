name: citoyen_alerte_app_backup
description: "Application mobile de signalement citoyen pour le Sénégal"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2

  # ============ STATE MANAGEMENT ============
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  flutter_hooks: ^0.21.3+1
  hooks_riverpod: ^2.6.1
  get: ^4.6.6

  # ============ NETWORKING ============
  dio: ^5.9.0
  retrofit: ^4.1.0
  pretty_dio_logger: ^1.3.1
  connectivity_plus: ^7.0.0

  # ============ LOCAL STORAGE ============
  flutter_secure_storage: ^10.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  # ============ MAPS & LOCATION ============
  google_maps_flutter: 2.5.3
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  flutter_polyline_points: ^3.1.0

  # ============ IMAGE HANDLING ============
  image_picker: ^1.1.0
  cached_network_image: ^3.3.1
  photo_view: ^0.15.0
  flutter_image_compress: ^2.2.0
  image_cropper: ^12.2.1

  # ============ FIREBASE ============
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  firebase_messaging: ^15.2.5
  firebase_analytics: ^11.4.4
  firebase_crashlytics: ^4.3.4
  flutter_local_notifications: ^18.0.1

  # ============ GOOGLE SIGN IN ============
  google_sign_in: ^6.2.2

  # ============ UI COMPONENTS ============
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  flutter_spinkit: ^5.2.1
  fl_chart: ^1.1.1
  timeline_tile: ^2.0.0
  step_progress_indicator: ^1.0.2
  percent_indicator: ^4.2.3
  badges: ^3.1.2
  flutter_rating_bar: ^4.0.1
  smooth_page_indicator: ^2.0.1

  # ============ UTILITIES ============
  timeago: ^3.6.1
  uuid: ^4.4.0
  url_launcher: ^6.2.6
  share_plus: ^10.0.0
  package_info_plus: ^8.0.0
  device_info_plus: ^10.0.0
  permission_handler: ^11.3.1
  flutter_dotenv: ^6.0.0
  logger: ^2.2.0

  # ============ FORMS & VALIDATION ============
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.1.2

  # ============ ICONS ============
  cupertino_icons: ^1.0.6
  font_awesome_flutter: ^11.0.0

  # ============ CAMERA & QR ============
  mobile_scanner: ^5.0.0

  # ============ PDF & FILES ============
  pdf: ^3.10.8
  printing: ^5.12.0
  file_picker: ^8.0.0
  open_file: ^3.3.2
  path: ^1.9.0

  # ============ ANIMATIONS ============
  flutter_animate: ^4.5.0
  animated_text_kit: ^4.2.2

  # ============ CHAT ============
  emoji_picker_flutter: ^4.4.0

  # ============ VIDEO PLAYER ============
  video_player: ^2.8.6
  chewie: ^1.8.1

  # ============ WEBVIEW ============
  webview_flutter: ^4.7.0

  # ============ BIOMETRIC ============
  local_auth: ^2.3.0

  # ============ IN-APP REVIEW ============
  in_app_review: ^2.0.9

  # ============ CAROUSEL ============
  carousel_slider: ^5.0.0

  # ============ CALENDAR ============
  table_calendar: ^3.1.1

  # ============ JSON SERIALIZATION ============
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1

  # ============ RESPONSIVE ============
  flutter_screenutil: ^5.9.3
  responsive_framework: ^1.4.0

  # ============ AUDIO PLAYER ============
  just_audio: ^0.9.40

  # ============ BOTTOM SHEET ============
  sliding_up_panel: ^2.0.0+1

  # ============ OTP ============
  pinput: ^5.0.0

  # ============ COUNTRY PICKER ============
  country_picker: ^2.0.26

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  retrofit_generator: ^8.1.0
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0

dependency_overrides:
  google_maps_flutter_android: 2.14.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/splash_logo.png
  color_dark: "#000000"
  image_dark: assets/images/splash_logo_dark.png
  android_12:
    image: assets/images/splash_logo.png
    color: "#FFFFFF"
  web: false

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/